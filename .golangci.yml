# golangci-lint 配置
# 设计目标:抓住此前审计中发现的几类问题(并发可见性/资源未释放/全局副作用),
# 同时不堵塞日常开发(test 文件放宽、第三方协议字段命名豁免、向后兼容的公共 API 命名豁免)。
version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - modernize     # 检查当前 Go 版本支持的新写法
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*go.uber.org/zap.Logger).Sync
        - fmt.Fprintf
        - fmt.Fprintln
    gocritic:
      disabled-checks:
        - ifElseChain  # 与 switch 转换有时降低可读性,交给人判断
    gosec:
      excludes:
        # G104 由 errcheck 覆盖,避免重复
        - G104
        # G304 文件路径来自启动期已校验的配置,业务侧使用场景多
        - G304
        # G115 整数转换:本框架 int↔int8 转换都来自 oneof=-1/-2/0/1/2 校验过的配置,
        # 实际不会越界。逐处加 #nosec 注释噪声大,统一豁免。
        - G115
    revive:
      rules:
        - name: var-naming
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # 测试文件放宽:容许 errcheck/gosec 报警,测试更看重清晰度
      - linters:
          - bodyclose
          - errcheck
          - gosec
          - revive
        path: _test\.go
      # 第三方 API 响应结构命名(snake_case)不强制 var-naming
      - linters:
          - revive
        path: internal/components/lognotice/sender_.*\.go
        text: var-naming
      # 公共 API 历史命名:WithHttp/UseHttp/GenZapNanoId/HttpCallTimeOut 等已被业务侧引用,
      # 重命名是破坏性变更。在新增 API 时遵循 var-naming(HTTP/ID),旧名保留豁免。
      - linters:
          - revive
        path: pkgs/(options|common)/.*\.go
        text: var-naming
      # G404 jitter/退避场景用 math/rand/v2 是合理的,无需 crypto 强随机
      - linters:
          - gosec
        path: internal/components/grpc/grpc_etcd_keep_live\.go
        text: G404
    paths:
      # .claude/.omc 是工作区辅助目录,worktrees 里是 agent 副本,不参与编译/lint
      - \.claude
      - \.omc
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
